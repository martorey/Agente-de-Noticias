name: Diagnóstico de fuentes

# Ejecutar a mano desde la pestaña Actions para ver qué feeds responden.
# Útil al configurar el agente y cuando una fuente deja de aparecer.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué revisar"
        type: choice
        default: check-feeds
        options:
          - check-feeds # prueba las URLs configuradas
          - descubrir # además busca en la portada de cada medio
  schedule:
    # El barrido semanal usa `descubrir`, que revisa también las fuentes
    # apagadas: si un medio vuelve a publicar RSS, aparece en el reporte.
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Revisar feeds
        env:
          FUENTES_EXTRA: ${{ vars.FUENTES_EXTRA }}
          FUENTES_EXCLUIDAS: ${{ vars.FUENTES_EXCLUIDAS }}
        # En las corridas programadas `inputs` viene vacío y cae en `descubrir`.
        run: python -m agente.main ${{ inputs.modo || 'descubrir' }}
