name: Agente de noticias

on:
  schedule:
    # Dispara 6 veces al día: la unión de las 3 horas objetivo en Chile
    # (8:00, 13:00, 20:00) convertidas a UTC para verano (UTC-3) e invierno
    # (UTC-4). El job "horario" descarta las 3 corridas que no correspondan
    # a la temporada actual, así el aviso siempre sale a la hora chilena
    # correcta sin tener que tocar el cron cuando cambia el horario.
    - cron: "0 0,11,12,16,17,23 * * *"
  workflow_dispatch:
    inputs:
      sin_whatsapp:
        description: "Publicar la página sin enviar el WhatsApp"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Si una corrida se solapa con la anterior, la nueva espera: así el estado de
# noticias vistas no se pisa entre ejecuciones.
concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  # Corre siempre (es liviano) y decide si esta corrida cae en una de las 3
  # horas objetivo en Chile. Como usa la hora real del huso "America/Santiago",
  # el resultado ya viene correcto en verano y en invierno sin distinguirlos
  # a mano. Los disparos manuales (Run workflow) no se filtran: siempre corren.
  horario:
    runs-on: ubuntu-latest
    outputs:
      correr: ${{ steps.check.outputs.correr }}
    steps:
      - name: Verificar si corresponde correr (hora de Chile)
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "correr=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hora_cl=$(TZ=America/Santiago date +%H)
          case "$hora_cl" in
            08|13|20) echo "correr=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "correr=false" >> "$GITHUB_OUTPUT" ;;
          esac

  publicar:
    needs: horario
    if: needs.horario.outputs.correr == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # El estado (qué titulares ya se vieron) vive en la caché en lugar del
      # repositorio, para no generar un commit por corrida.
      - name: Restaurar estado
        uses: actions/cache/restore@v4
        with:
          path: .estado
          key: estado-noticias-${{ github.run_id }}
          restore-keys: |
            estado-noticias-

      - name: Recolectar noticias y avisar
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          SITE_TITLE: ${{ vars.SITE_TITLE || 'Últimas noticias' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'America/Santiago' }}
          NOTIFY_MODE: ${{ vars.NOTIFY_MODE || 'solo-nuevas' }}
          NOTIFY_MIN_NEW: ${{ vars.NOTIFY_MIN_NEW || '10' }}
          NOTIFY_HEADLINES: ${{ vars.NOTIFY_HEADLINES || '3' }}
          MAX_ITEMS_PER_SECTION: ${{ vars.MAX_ITEMS_PER_SECTION || '40' }}
          MAX_AGE_HOURS: ${{ vars.MAX_AGE_HOURS || '24' }}
          FUENTES_EXTRA: ${{ vars.FUENTES_EXTRA }}
          FUENTES_EXCLUIDAS: ${{ vars.FUENTES_EXCLUIDAS }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          DRY_RUN: ${{ inputs.sin_whatsapp && '1' || '0' }}
          OUTPUT_DIR: public
        run: python -m agente.main run

      - name: Guardar estado
        # Se guarda aunque el envío del WhatsApp haya fallado, para no repetir
        # los mismos titulares en la próxima corrida.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .estado
          key: estado-noticias-${{ github.run_id }}

      # enablement activa Pages por API en la primera corrida, así no hay que
      # configurarlo a mano. Falla igual si el repositorio es privado y la
      # cuenta no tiene Pages disponible.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
